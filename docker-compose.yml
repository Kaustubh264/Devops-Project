services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shopkart
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shopkart"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  shopkart:
    build: ./services/product-service
    environment:
      DATABASE_URL: postgresql+psycopg2://shop:${POSTGRES_PASSWORD}@db:5432/shopkart
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
