apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopkart
  namespace: shopkart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopkart
  template:
    metadata:
      labels:
        app: shopkart
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: shopkart
          image: kaustubhtayade/shopkart:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopkart-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopkart-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              value: "postgresql+psycopg2://shop:$(POSTGRES_PASSWORD)@db:5432/shopkart"
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shopkart
  namespace: shopkart
spec:
  type: NodePort
  selector:
    app: shopkart
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
